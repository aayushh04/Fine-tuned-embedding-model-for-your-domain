# Single source of truth for the whole pipeline. Paths are relative to the repo root.
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  synthetic_dir: data/synthetic
  triplets_dir: data/triplets
  models_dir: models
  results_dir: results

# Domain corpus: the Python web-API stack (FastAPI + the libraries it is built on).
# Each source is pinned to a release tag so the corpus is reproducible.
corpus:
  sources:
    - name: fastapi
      label: FastAPI
      repo: fastapi/fastapi
      ref: "0.115.12"
      docs_dir: docs/en/docs
      include_base: docs/en   # code includes ({* ../../docs_src/x.py *}) resolve from here
      exclude:
        - release-notes.md
        - reference/**
        - contributing.md
        - management*.md
        - fastapi-people.md
        - help-fastapi.md
        - external-links.md
        - newsletter.md
        - about/**
        - resources/**
        - learn/**
    - name: pydantic
      label: Pydantic
      repo: pydantic/pydantic
      ref: v2.11.7
      docs_dir: docs
      exclude:
        - api/**
        - contributing.md
        - help_with_pydantic.md
        - pydantic_people.md
    - name: starlette
      label: Starlette
      repo: encode/starlette
      ref: "0.46.2"
      docs_dir: docs
      exclude:
        - release-notes.md
        - sponsorship.md
        - contributing.md

chunking:
  # Tokens are counted with the base embedding model's tokenizer, so "300 tokens" means
  # the same thing the model sees (bge-small truncates at 512).
  tokenizer: BAAI/bge-small-en-v1.5
  chunk_size: 350      # max tokens per chunk (including the breadcrumb line)
  overlap: 50          # max tokens of trailing blocks carried into the next chunk
  min_tokens: 60       # chunks shorter than this are merged or dropped

# Embedding models. `query_prefix` is the instruction the model was trained to expect on queries.
models:
  minilm:
    hf_name: sentence-transformers/all-MiniLM-L6-v2
    query_prefix: ""
    max_seq_length: 384
  bge-small:
    hf_name: BAAI/bge-small-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    max_seq_length: 384
  bge-base:                      # "larger" baseline (110M params), not fine-tuned (4 GB GPU)
    hf_name: BAAI/bge-base-en-v1.5
    query_prefix: "Represent this sentence for searching relevant passages: "
    max_seq_length: 384

synthetic:
  # Phase 2. Train/val questions: local LLM (no API key needed). Test questions: written by
  # Claude (data/synthetic/test_questions_claude.jsonl) so the test writer != the train writer.
  local_llm: Qwen/Qwen2.5-0.5B-Instruct
  questions_per_chunk: 3
  temperature: 0.6
  batch_size: 4                  # >4 spills GPU memory on a 4 GB card and gets ~5x slower per chunk
  max_new_tokens: 150
  filter_model: bge-small        # base model used for the round-trip check
  roundtrip_top_k: 20
  min_question_words: 5
  max_copy_ngram: 6              # reject if question shares a >=6-word run with the chunk
  dup_threshold: 0.92            # cosine similarity above which two questions count as duplicates

negatives:
  # Phase 4
  mine_top_k: 50
  rank_min: 10                   # sample from ranks [rank_min, mine_top_k)
  cross_encoder: cross-encoder/ms-marco-MiniLM-L-6-v2
  ce_shortlist: 8                # candidates per question that get cross-encoder verification
  ce_margin: 1.0                 # drop candidate if CE(q, neg) > CE(q, pos) - margin
  max_pos_similarity: 0.90       # drop candidate if cos(pos, neg) is above this

training:
  # Phase 5
  lr: 2.0e-5
  epochs: 3
  batch_size: 32                 # effective batch (in-batch negatives are drawn from all 32)
  mini_batch_size: 8             # GradCache chunk size: same gradients, fits in 4 GB
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: false                    # GTX 1650: fp16 matmul is ~8x slower than fp32 here (measured), so train in fp32
  seeds: [42, 43, 44]

forgetting:
  datasets: [scifact, nfcorpus]  # BEIR subsets
  max_queries: 300

rag:
  n_questions: 50
  top_k: 5
  generator: Qwen/Qwen2.5-0.5B-Instruct
  max_new_tokens: 200

split:
  train: 0.7
  val: 0.1
  test: 0.2
  # Docs with more chunks than this always go to train, so one long reference page
  # (e.g. Pydantic's 100-chunk validation-error catalog) cannot dominate val/test.
  max_eval_doc_chunks: 40
